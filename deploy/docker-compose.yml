version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: pnpm --filter @repo-intel/web start
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
