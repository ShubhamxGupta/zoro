name: Monorepo CI Quality Gate & Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  repository-validation:
    name: 1. Repository & Dependency Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & pnpm
        run: corepack enable

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Formatting
        run: npm run format:check || true

  type-check:
    name: 2. TypeScript Composite Typecheck
    runs-on: ubuntu-latest
    needs: repository-validation
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & pnpm
        run: corepack enable

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Composite TypeScript Typecheck
        run: npm run build

  unit-tests:
    name: 3. Unit & Integration Test Suite
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & pnpm
        run: corepack enable

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Vitest Test Suite
        run: npx vitest run --coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/

  package-builds:
    name: 4. Workspace Package Builds
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & pnpm
        run: corepack enable

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Monorepo Workspace Packages
        run: npm run build

  security-audit:
    name: 5. Security & Dependency Audit
    runs-on: ubuntu-latest
    needs: repository-validation
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high || true
