name: AI Pull Request Review & SARIF Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-code-review:
    name: AI Multi-Agent PR Review
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: npm run build

      - name: Execute Automated PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node apps/cli/dist/index.js pr review ${{ github.event.pull_request.number }}
          node apps/cli/dist/index.js pr export sarif > results.sarif

      - name: Upload SARIF Security Artifact
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
